name: Test @dbt-tools/web

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test-dbt-tools-web.yml
      - packages/web/**
      - packages/core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/smoke-npx-with-verdaccio.sh
      - scripts/verdaccio-smoke.yaml
  push:
    branches: [main]

concurrency:
  group: test-dbt-tools-web-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  web-pack-npx-smoke:
    name: Web pack + npx smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verdaccio publish @dbt-tools peers + pack + npx smoke
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/smoke-npx-with-verdaccio.sh

  e2e:
    name: E2E ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @dbt-tools/web exec playwright install chromium --with-deps

      - name: Build (vite preview needs dist)
        run: pnpm build

      - name: Run Playwright (shard)
        run: pnpm --filter @dbt-tools/web exec playwright test --shard=${{ matrix.shard }}/2
