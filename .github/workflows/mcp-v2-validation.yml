name: MCP v2 focused validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Test MCP package
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @dbt-tools/mcp test 2>&1 | tee /tmp/mcp-test.log

      - name: Upload MCP test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-test-log
          path: /tmp/mcp-test.log

      - name: Stop after MCP test failure
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Smoke protocol eras
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @dbt-tools/mcp smoke:protocol 2>&1 | tee /tmp/mcp-smoke.log

      - name: Upload MCP smoke log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-smoke-log
          path: /tmp/mcp-smoke.log

      - name: Stop after MCP smoke failure
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Remove focused validation workflow
        shell: bash
        run: |
          rm .github/workflows/mcp-v2-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/mcp-v2-validation.yml
          git commit -m "ci(mcp): remove focused validation workflow"
          git push origin HEAD:${{ github.head_ref }}
