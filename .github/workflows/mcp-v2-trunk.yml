name: MCP v2 trunk diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  trunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dbt-tools/core build
      - id: trunk
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm exec trunk check -y > /tmp/trunk.log 2>&1
          status=$?
          printf '\n--- GIT DIFF AFTER TRUNK ---\n' >> /tmp/trunk.log
          git diff -- packages/mcp/src/server.ts packages/mcp/src/tools/tool-result.test.ts >> /tmp/trunk.log
          exit $status
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trunk-log
          path: /tmp/trunk.log
      - if: steps.trunk.outcome == 'failure'
        run: exit 1
