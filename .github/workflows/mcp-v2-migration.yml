name: MCP v2 migration validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Regenerate lockfile
        id: install
        continue-on-error: true
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile --config.resolution-mode=highest --reporter=append-only > /tmp/pnpm-install.log 2>&1

      - name: Upload pnpm failure log
        if: steps.install.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-install-error
          path: /tmp/pnpm-install.log

      - name: Stop after pnpm failure
        if: steps.install.outcome == 'failure'
        run: exit 1

      - name: Finalize migration metadata
        shell: bash
        run: |
          sed -i "s#\\^@modelcontextprotocol/sdk/#^@modelcontextprotocol/#" eslint.config.mjs
          sed -i "s#@modelcontextprotocol/sdk outputSchema normalization#@modelcontextprotocol/server output-schema registration#" packages/core/src/contracts/resource-details.ts
          rm .github/workflows/mcp-v2-migration.yml

      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml eslint.config.mjs packages/core/src/contracts/resource-details.ts .github/workflows/mcp-v2-migration.yml
          git commit -m "chore(mcp): regenerate lockfile for SDK v2"
          git push origin HEAD:${{ github.head_ref }}

      - name: Build workspace
        run: pnpm build

      - name: Test MCP package
        run: pnpm --filter @dbt-tools/mcp test

      - name: Smoke MCP protocol eras
        run: pnpm --filter @dbt-tools/mcp smoke:protocol
