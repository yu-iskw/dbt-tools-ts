name: CI

# prettier-ignore
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - .agents/**
      - .claude/**
      - .cursor/**
      - .vscode/**
  pull_request:
    paths-ignore:
      - "**/*.md"
      - docs/**
      - .agents/**
      - .claude/**
      - .cursor/**
      - .vscode/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  ci:
    name: Test, analyze, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @dbt-tools/core for ESLint
        run: pnpm --filter @dbt-tools/core build

      - name: Lint (ESLint report)
        run: pnpm lint:report

      - name: Upload lint report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: lint-report.json

      - name: Find unused code (Knip)
        run: pnpm knip

      - name: Run build
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm coverage:report

      - name: MCP protocol smoke
        run: pnpm smoke:mcp

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          setup-deps: true
