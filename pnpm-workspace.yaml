packages:
  - packages/*
  - docs/site

# Supply-chain protection (pnpm 11 defaults, with 7-day quarantine)
# https://pnpm.io/blog/releases/11.0
minimumReleaseAge: 10080 # 7 days * 1440 min; RFC-0001 §8.1
# blockExoticSubdeps: true # explicit; matches v11 default
# resolution-mode: highest # tolerate registry metadata missing "time" for transitive deps

# Build scripts: pnpm 11 requires explicit approval for dependencies that run install scripts.
# Approved for Vite/Vitest toolchain (esbuild native binary, unrs-resolver postinstall).
allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  'brace-expansion@<5.0.6': ^5.0.6
  '@tootallnate/once@<3.0.1': ^3.0.1
  esbuild: ^0.27.2
  fast-xml-parser@<5.7.0: ^5.7.0
  flatted: '>=3.4.2'
  lodash: ^4.18.0
  postcss@<8.5.10: ^8.5.10
  rollup: '>=4.59.0'
  tar: ^7.5.13
  vitepress>vite: ^6.4.2

minimumReleaseAgeExclude:
  - '@tootallnate/once@3.0.1'
  - '@types/node@25.7.0'
  - dbt-artifacts-parser@0.5.5
  - eslint-plugin-react-hooks
  - eslint-plugin-react-hooks@7.0.1
  - fast-xml-parser@5.7.0
  - file-entry-cache@11.1.3
  - postcss@8.5.10
  - semver@7.7.4
  - tar@7.5.13
  - yaml@2.8.3
  - '@dbt-tools/*'
  - vite@6.4.2
  - '@vitejs/plugin-vue@5.2.4'
