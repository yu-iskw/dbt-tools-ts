<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-label="the same manifest and run_results pair under a local target path or an s3 or gs prefix.">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B" />
    </marker>
  </defs>

  <rect width="820" height="280" fill="#F6F7FB" />

  <rect x="24" y="36" width="160" height="56" rx="10" fill="#635BFF" />
  <text x="104" y="70" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="14" font-weight="600">./target</text>

  <rect x="24" y="188" width="160" height="56" rx="10" fill="#635BFF" />
  <text x="104" y="212" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="13" font-weight="600">s3://...</text>
  <text x="104" y="230" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="13" font-weight="600">gs://...</text>

  <line x1="184" y1="64" x2="276" y2="118" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="184" y1="216" x2="276" y2="162" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="284" y="88" width="230" height="104" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" />
  <text x="399" y="122" text-anchor="middle" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13" font-weight="600">same target contract</text>
  <text x="399" y="150" text-anchor="middle" fill="#1E293B" font-family="ui-monospace, monospace" font-size="12">manifest.json</text>
  <text x="399" y="172" text-anchor="middle" fill="#1E293B" font-family="ui-monospace, monospace" font-size="12">run_results.json</text>

  <line x1="514" y1="140" x2="568" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="576" y="108" width="200" height="64" rx="10" fill="#635BFF" />
  <text x="676" y="138" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">CLI / MCP / Web</text>
  <text x="676" y="158" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11">consume either path</text>
</svg>
