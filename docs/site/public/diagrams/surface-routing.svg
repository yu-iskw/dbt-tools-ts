<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="agent skills invoke CLI or MCP; Web, CLI, and MCP each use the shared analysis library; Web is not driven by CLI or MCP.">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B" />
    </marker>
  </defs>

  <rect width="900" height="320" fill="#F6F7FB" />

  <!-- Agent skills / plugins -->
  <rect x="24" y="120" width="150" height="80" rx="10" fill="#635BFF" />
  <text x="99" y="152" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Agent skills</text>
  <text x="99" y="174" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">plugins</text>

  <line x1="174" y1="140" x2="248" y2="70" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="174" y1="180" x2="248" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="200" y="108" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">invoke</text>

  <!-- CLI and MCP -->
  <rect x="256" y="36" width="130" height="56" rx="10" fill="#635BFF" />
  <text x="321" y="70" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">CLI</text>

  <rect x="256" y="152" width="130" height="56" rx="10" fill="#635BFF" />
  <text x="321" y="186" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">MCP</text>

  <!-- Web sibling (no arrow from CLI/MCP) -->
  <rect x="256" y="248" width="130" height="56" rx="10" fill="#635BFF" />
  <text x="321" y="282" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Web</text>

  <!-- Into shared core -->
  <line x1="386" y1="64" x2="460" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="386" y1="180" x2="460" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="386" y1="276" x2="460" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Shared analysis substrate -->
  <rect x="468" y="120" width="240" height="100" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" stroke-dasharray="7 5" />
  <text x="588" y="158" text-anchor="middle" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="600">shared analysis</text>
  <text x="588" y="182" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="12">@dbt-tools/core</text>
  <text x="588" y="202" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">substrate, not a surface call</text>

  <text x="740" y="170" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Web is a sibling</text>
  <text x="740" y="188" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">not driven by CLI/MCP</text>
</svg>
