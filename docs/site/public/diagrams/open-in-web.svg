<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" role="img" aria-label="with DBT_TOOLS_WEB_BASE_URL set, CLI discover or explain JSON includes a web_url that a browser opens into the same Web UI context.">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B" />
    </marker>
  </defs>

  <rect width="980" height="240" fill="#F6F7FB" />

  <!-- Prerequisite -->
  <rect x="16" y="28" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" stroke-dasharray="6 4" />
  <text x="116" y="58" text-anchor="middle" fill="#1E293B" font-family="system-ui, sans-serif" font-size="11" font-weight="600">prerequisite</text>
  <text x="116" y="78" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">DBT_TOOLS_WEB_BASE_URL</text>

  <rect x="16" y="140" width="200" height="72" rx="10" fill="#635BFF" />
  <text x="116" y="172" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="12" font-weight="600">discover | explain</text>
  <text x="116" y="194" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="12">--json</text>

  <line x1="116" y1="100" x2="116" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="216" y1="176" x2="268" y2="176" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="276" y="140" width="140" height="72" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" />
  <text x="346" y="182" text-anchor="middle" fill="#1E293B" font-family="ui-monospace, monospace" font-size="14" font-weight="600">web_url</text>

  <line x1="416" y1="176" x2="468" y2="176" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="476" y="140" width="160" height="72" rx="10" fill="#635BFF" />
  <text x="556" y="172" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Browser</text>
  <text x="556" y="194" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">opens deep link</text>

  <line x1="636" y1="176" x2="688" y2="176" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="696" y="140" width="240" height="72" rx="10" fill="#635BFF" />
  <text x="816" y="172" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Web UI</text>
  <text x="816" y="194" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">same discover / explain context</text>
</svg>
