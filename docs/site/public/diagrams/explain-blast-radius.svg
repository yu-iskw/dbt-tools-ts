<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-label="explain a resource by unique_id then trace downstream dependencies for blast radius.">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B" />
    </marker>
  </defs>

  <rect x="24" y="58" width="160" height="84" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" />
  <text x="104" y="100" text-anchor="middle" fill="#1E293B" font-family="ui-monospace, monospace" font-size="13" font-weight="600">unique_id</text>
  <text x="104" y="122" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">resource</text>

  <line x1="184" y1="100" x2="236" y2="100" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="244" y="58" width="160" height="84" rx="10" fill="#635BFF" />
  <text x="324" y="100" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="14" font-weight="600">explain</text>
  <text x="324" y="122" text-anchor="middle" fill="#E8E6FF" font-family="system-ui, sans-serif" font-size="11">what / why</text>

  <line x1="404" y1="100" x2="456" y2="100" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="464" y="58" width="280" height="84" rx="10" fill="#635BFF" />
  <text x="604" y="92" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="14" font-weight="600">deps --direction downstream</text>
  <text x="604" y="116" text-anchor="middle" fill="#E8E6FF" font-family="system-ui, sans-serif" font-size="12">blast radius</text>
</svg>
