<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-label="discovery query yields ranked matches with reasons; CLI, MCP, and Web use the same ranking contract.">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B" />
    </marker>
  </defs>

  <rect x="24" y="108" width="140" height="64" rx="10" fill="#635BFF" />
  <text x="94" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">query</text>

  <line x1="164" y1="140" x2="208" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="216" y="92" width="200" height="96" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" />
  <text x="316" y="130" text-anchor="middle" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="600">ranked matches</text>
  <text x="316" y="154" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">+ reasons</text>

  <line x1="416" y1="110" x2="476" y2="50" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="416" y1="140" x2="476" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="416" y1="170" x2="476" y2="230" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="484" y="26" width="120" height="48" rx="8" fill="#635BFF" />
  <text x="544" y="56" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">CLI</text>

  <rect x="484" y="116" width="120" height="48" rx="8" fill="#635BFF" />
  <text x="544" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MCP</text>

  <rect x="484" y="206" width="120" height="48" rx="8" fill="#635BFF" />
  <text x="544" y="236" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Web</text>

  <text x="640" y="140" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">same ranking</text>
  <text x="640" y="158" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">contract</text>
</svg>
