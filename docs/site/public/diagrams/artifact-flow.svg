<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-label="dbt run, build, or test writes manifest.json and run_results.json under a target prefix; dbt-tools CLI, MCP, and Web consume those artifacts.">
  <!-- Hand-authored orientation diagram: dbt -> target artifacts -> CLI / MCP / Web -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B" />
    </marker>
  </defs>

  <rect width="860" height="280" fill="#F6F7FB" />

  <!-- Column 1: dbt -->
  <rect x="16" y="108" width="176" height="64" rx="10" fill="#635BFF" />
  <text x="104" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">dbt run / build / test</text>

  <line x1="192" y1="140" x2="236" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Column 2: target/ prefix -->
  <rect x="244" y="108" width="140" height="64" rx="10" fill="#635BFF" />
  <text x="314" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">target/ prefix</text>

  <line x1="384" y1="124" x2="428" y2="74" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="384" y1="156" x2="428" y2="206" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Column 3: artifact files -->
  <rect x="436" y="42" width="168" height="52" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" />
  <text x="520" y="74" text-anchor="middle" fill="#1E293B" font-family="ui-monospace, monospace" font-size="13" font-weight="600">manifest.json</text>

  <rect x="436" y="186" width="168" height="52" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" />
  <text x="520" y="218" text-anchor="middle" fill="#1E293B" font-family="ui-monospace, monospace" font-size="13" font-weight="600">run_results.json</text>

  <!-- Merge bus: both artifacts feed CLI / MCP / Web -->
  <line x1="604" y1="68" x2="640" y2="68" stroke="#64748B" stroke-width="2" />
  <line x1="604" y1="212" x2="640" y2="212" stroke="#64748B" stroke-width="2" />
  <line x1="640" y1="60" x2="640" y2="220" stroke="#64748B" stroke-width="2" />
  <line x1="640" y1="60" x2="676" y2="60" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="140" x2="676" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="220" x2="676" y2="220" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Column 4: peer surfaces that read artifacts -->
  <rect x="684" y="40" width="100" height="40" rx="8" fill="#635BFF" />
  <text x="734" y="65" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">CLI</text>

  <rect x="684" y="120" width="100" height="40" rx="8" fill="#635BFF" />
  <text x="734" y="145" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MCP</text>

  <rect x="684" y="200" width="100" height="40" rx="8" fill="#635BFF" />
  <text x="734" y="225" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Web</text>

  <text x="804" y="145" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">dbt-tools</text>
</svg>
