<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="dbt run, build, or test writes manifest.json and run_results.json under a target prefix; dbt-tools CLI, MCP, Web, and Agents consume those artifacts.">
  <!-- Hand-authored orientation diagram: dbt ? target artifacts ? four surfaces -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Column 1: dbt -->
  <rect x="16" y="118" width="176" height="64" rx="10" fill="#635BFF" />
  <text x="104" y="156" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">dbt run / build / test</text>

  <line x1="192" y1="150" x2="236" y2="150" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Column 2: target/ prefix -->
  <rect x="244" y="118" width="140" height="64" rx="10" fill="#635BFF" />
  <text x="314" y="156" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">target/ prefix</text>

  <line x1="384" y1="134" x2="428" y2="84" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="384" y1="166" x2="428" y2="216" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Column 3: artifact files -->
  <rect x="436" y="52" width="168" height="52" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" />
  <text x="520" y="84" text-anchor="middle" fill="#1E293B" font-family="ui-monospace, monospace" font-size="13" font-weight="600">manifest.json</text>

  <rect x="436" y="196" width="168" height="52" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="2" />
  <text x="520" y="228" text-anchor="middle" fill="#1E293B" font-family="ui-monospace, monospace" font-size="13" font-weight="600">run_results.json</text>

  <!-- Merge bus: both artifacts ? surfaces -->
  <line x1="604" y1="78" x2="640" y2="78" stroke="#64748B" stroke-width="2" />
  <line x1="604" y1="222" x2="640" y2="222" stroke="#64748B" stroke-width="2" />
  <line x1="640" y1="78" x2="640" y2="222" stroke="#64748B" stroke-width="2" />
  <line x1="640" y1="70" x2="676" y2="70" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="122" x2="676" y2="122" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="174" x2="676" y2="174" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="226" x2="676" y2="226" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Column 4: peer surfaces -->
  <rect x="684" y="50" width="100" height="40" rx="8" fill="#635BFF" />
  <text x="734" y="75" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">CLI</text>

  <rect x="684" y="102" width="100" height="40" rx="8" fill="#635BFF" />
  <text x="734" y="127" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MCP</text>

  <rect x="684" y="154" width="100" height="40" rx="8" fill="#635BFF" />
  <text x="734" y="179" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Web</text>

  <rect x="684" y="206" width="100" height="40" rx="8" fill="#635BFF" />
  <text x="734" y="231" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Agents</text>

  <text x="804" y="155" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">dbt-tools</text>
</svg>
